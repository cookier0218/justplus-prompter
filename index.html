<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="提詞機">
<meta name="theme-color" content="#001524">
<title>JustPlus 提詞機</title>
<style>
  :root {
    --bg: #001524;            /* 惟家品牌深藍 brand-navy */
    --fg: #fff;
    --accent: #8bc34a;        /* 品牌亮綠：指示線 / highlight，深底上最清楚 */
    --accent-solid: #6a9739;  /* 品牌主綠：實心按鈕 */
    --panel: #06283a;
    --panel-2: #0e3a52;
    --muted: #7f97a6;
    --line: #123a52;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    color: var(--fg);
    background: var(--panel-2);
    border-radius: 12px;
    transition: background .15s, transform .05s;
    -webkit-user-select: none;
    user-select: none;
  }
  button:active { transform: scale(0.96); }

  /* ============ 編輯畫面 ============ */
  #editor {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: #00111c;
  }
  #editor .inner {
    display: flex;
    flex-direction: column;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 20px;
    height: 100%;
  }
  #editor h1 {
    font-size: 22px;
    margin: 6px 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #editor h1 .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  #editor .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }

  #script {
    flex: 1;
    width: 100%;
    background: var(--panel);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    font-size: 18px;
    line-height: 1.7;
    resize: none;
    outline: none;
    margin-bottom: 16px;
  }
  #script:focus { border-color: var(--accent); }

  .settings {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .setting {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
  }
  .setting label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .setting .row { display: flex; align-items: center; gap: 10px; }
  .setting .val { min-width: 46px; text-align: center; font-size: 16px; font-variant-numeric: tabular-nums; }
  .stepper { width: 40px; height: 36px; font-size: 20px; background: var(--panel-2); display: flex; align-items: center; justify-content: center; }
  .toggle {
    width: 100%; height: 40px; font-size: 15px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .toggle.on { background: var(--accent-solid); color: #fff; font-weight: 600; }

  #startBtn {
    height: 60px;
    font-size: 20px;
    font-weight: 700;
    background: var(--accent-solid);
    color: #fff;
    border-radius: 14px;
  }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 12px; line-height: 1.6; }

  /* ============ 提詞畫面 ============ */
  #prompter {
    position: absolute;
    inset: 0;
    display: none;
    background: var(--bg);
  }
  #prompter.active { display: block; }

  #scrollArea {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  #text {
    padding: 60vh 8vw;
    font-weight: 600;
    white-space: pre-wrap;
    word-break: break-word;
    will-change: transform;
  }

  /* 鏡像模式 */
  #prompter.mirror #text { transform: scaleX(-1); }
  #prompter.flip #text { transform: scaleY(-1); }
  #prompter.mirror.flip #text { transform: scale(-1, -1); }

  /* 閱讀指示線 */
  #guide {
    position: absolute;
    left: 0; right: 0;
    top: 38%;
    pointer-events: none;
    display: none;
  }
  #guide.show { display: block; }
  #guide .line { height: 2px; background: rgba(139,195,74,.55); }
  #guide .arrow {
    position: absolute; top: -8px; left: 12px;
    width: 0; height: 0;
    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;
    border-left: 14px solid var(--accent);
  }
  #guide .arrow.right {
    left: auto; right: 12px;
    border-left: none;
    border-right: 14px solid var(--accent);
  }

  /* 控制列 */
  #controls {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,.55) 70%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: opacity .3s;
    z-index: 5;
  }
  #controls.hidden { opacity: 0; pointer-events: none; }
  #controls .ctrl {
    width: 58px; height: 58px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    background: rgba(14,58,82,.9);
    backdrop-filter: blur(8px);
  }
  #controls .ctrl.wide { width: auto; padding: 0 18px; font-size: 15px; gap: 6px; }
  #playBtn { width: 72px; height: 72px; font-size: 30px; background: var(--accent-solid); color: #fff; }
  #controls .grp { display: flex; align-items: center; gap: 4px; background: rgba(14,58,82,.9); border-radius: 14px; padding: 4px; }
  #controls .grp .ctrl { width: 48px; height: 48px; background: transparent; font-size: 18px; }
  #controls .grp .label { font-size: 11px; color: var(--muted); min-width: 40px; text-align: center; }

  #speedBadge {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top));
    right: 16px;
    background: rgba(0,21,36,.65);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    transition: opacity .3s;
    z-index: 5;
  }
  #speedBadge.hidden { opacity: 0; }
  #exitBtn {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top));
    left: 16px;
    width: 44px; height: 44px;
    background: rgba(0,21,36,.65);
    border: 1px solid var(--line);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
    transition: opacity .3s;
  }
  #exitBtn.hidden { opacity: 0; pointer-events: none; }

  /* 大按鈕標籤 */
  .ctrl small { font-size: 10px; color: var(--muted); }

  .tapHint {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    color: var(--muted);
    font-size: 15px;
    text-align: center;
    pointer-events: none;
    opacity: .9;
    z-index: 4;
  }
</style>
</head>
<body>

<!-- ============ 編輯畫面 ============ -->
<div id="editor">
  <div class="inner">
    <h1><span class="dot"></span>JustPlus 提詞機</h1>
    <p class="sub">貼上腳本 → 調字級速度 → 開始提詞。設定會自動記住。</p>

    <textarea id="script" placeholder="在這裡貼上你的腳本…

例如：
大家好，歡迎回到 JustPlus 的頻道。
今天要跟大家分享…"></textarea>

    <div class="settings">
      <div class="setting">
        <label>字級</label>
        <div class="row">
          <button class="stepper" data-act="font-">–</button>
          <span class="val" id="fontVal">64</span>
          <button class="stepper" data-act="font+">+</button>
        </div>
      </div>
      <div class="setting">
        <label>捲動速度</label>
        <div class="row">
          <button class="stepper" data-act="speed-">–</button>
          <span class="val" id="speedVal">5</span>
          <button class="stepper" data-act="speed+">+</button>
        </div>
      </div>
      <div class="setting">
        <label>左右邊界</label>
        <div class="row">
          <button class="stepper" data-act="margin-">–</button>
          <span class="val" id="marginVal">8</span>
          <button class="stepper" data-act="margin+">+</button>
        </div>
      </div>
      <div class="setting">
        <label>鏡像（分光鏡用）</label>
        <button class="toggle" id="mirrorToggle">水平鏡像：關</button>
      </div>
    </div>

    <button id="startBtn">▶ 開始提詞</button>
    <p class="hint">
      藍牙遙控器／翻頁筆：<b>前進鍵＝播放/暫停</b>、<b>後退鍵＝退回重讀</b>、<b>上/下＝加減速</b>。<br>
      在 iPad Safari 用「分享 → 加入主畫面」可全螢幕執行。
    </p>
  </div>
</div>

<!-- ============ 提詞畫面 ============ -->
<div id="prompter">
  <div id="scrollArea">
    <div id="text"></div>
  </div>

  <div id="guide" class="show">
    <div class="arrow"></div>
    <div class="line"></div>
    <div class="arrow right"></div>
  </div>

  <div id="speedBadge">速度 5</div>
  <button id="exitBtn">✕</button>

  <div class="tapHint" id="tapHint">點畫面任一處：播放 / 暫停</div>

  <div id="controls">
    <button class="ctrl" id="restartBtn" title="回到開頭">⏮</button>
    <div class="grp">
      <button class="ctrl" data-act="speed-">–</button>
      <span class="label">速度</span>
      <button class="ctrl" data-act="speed+">+</button>
    </div>
    <button class="ctrl" id="playBtn">▶</button>
    <div class="grp">
      <button class="ctrl" data-act="font-">A－</button>
      <span class="label">字級</span>
      <button class="ctrl" data-act="font+">A＋</button>
    </div>
    <button class="ctrl wide" id="editBtn">✎ 編輯</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- 設定與狀態 ----------
  var DEFAULTS = { font: 64, speed: 5, margin: 8, mirror: false, flip: false, text: "" };
  var cfg = load();

  var el = {
    editor: document.getElementById("editor"),
    prompter: document.getElementById("prompter"),
    script: document.getElementById("script"),
    text: document.getElementById("text"),
    scrollArea: document.getElementById("scrollArea"),
    fontVal: document.getElementById("fontVal"),
    speedVal: document.getElementById("speedVal"),
    marginVal: document.getElementById("marginVal"),
    mirrorToggle: document.getElementById("mirrorToggle"),
    startBtn: document.getElementById("startBtn"),
    playBtn: document.getElementById("playBtn"),
    editBtn: document.getElementById("editBtn"),
    exitBtn: document.getElementById("exitBtn"),
    restartBtn: document.getElementById("restartBtn"),
    controls: document.getElementById("controls"),
    speedBadge: document.getElementById("speedBadge"),
    tapHint: document.getElementById("tapHint"),
    guide: document.getElementById("guide")
  };

  var playing = false;
  var offset = 0;          // 目前捲動位移（px，正值往上捲）
  var lastTs = 0;
  var wakeLock = null;
  var hideTimer = null;

  // ---------- 讀寫本機設定 ----------
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem("tp_cfg") || "{}");
      var c = {};
      for (var k in DEFAULTS) c[k] = (k in s) ? s[k] : DEFAULTS[k];
      return c;
    } catch (e) { return Object.assign({}, DEFAULTS); }
  }
  function save() {
    try { localStorage.setItem("tp_cfg", JSON.stringify(cfg)); } catch (e) {}
  }

  // ---------- 套用設定到畫面 ----------
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function applyEditorUI() {
    el.fontVal.textContent = cfg.font;
    el.speedVal.textContent = cfg.speed;
    el.marginVal.textContent = cfg.margin;
    el.mirrorToggle.textContent = "水平鏡像：" + (cfg.mirror ? "開" : "關");
    el.mirrorToggle.classList.toggle("on", cfg.mirror);
    el.script.value = cfg.text;
  }

  function applyPrompterStyle() {
    el.text.style.fontSize = cfg.font + "px";
    el.text.style.lineHeight = 1.5;
    el.text.style.paddingLeft = cfg.margin + "vw";
    el.text.style.paddingRight = cfg.margin + "vw";
    el.prompter.classList.toggle("mirror", cfg.mirror);
    el.prompter.classList.toggle("flip", cfg.flip);
    el.speedBadge.textContent = "速度 " + cfg.speed;
  }

  // ---------- 捲動引擎 ----------
  function maxOffset() {
    return Math.max(0, el.text.scrollHeight - el.scrollArea.clientHeight);
  }
  function render() {
    el.text.style.transform = "translateY(" + (-offset) + "px)";
  }
  function speedToPxPerSec(s) {
    // 速度 1~20 → 大約 20~400 px/秒，字級大時等比放大讓體感一致
    var base = s * 18;
    return base * (cfg.font / 64);
  }
  function tick(ts) {
    if (!playing) return;
    if (!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    offset += speedToPxPerSec(cfg.speed) * dt;
    var max = maxOffset();
    if (offset >= max) { offset = max; setPlaying(false); }
    render();
    if (playing) requestAnimationFrame(tick);
  }

  function setPlaying(p) {
    playing = p;
    lastTs = 0;
    el.playBtn.textContent = p ? "⏸" : "▶";
    el.tapHint.style.display = "none";
    if (p) {
      requestAnimationFrame(tick);
      requestWakeLock();
      scheduleHideControls();
    } else {
      showControls();
    }
  }
  function togglePlay() { setPlaying(!playing); }

  function nudge(px) {
    offset = clamp(offset + px, 0, maxOffset());
    render();
  }
  function restart() {
    offset = 0; render();
    setPlaying(false);
  }

  // ---------- 速度 / 字級調整 ----------
  function changeSpeed(d) {
    cfg.speed = clamp(cfg.speed + d, 1, 20);
    el.speedVal.textContent = cfg.speed;
    el.speedBadge.textContent = "速度 " + cfg.speed;
    flashBadge();
    save();
  }
  function changeFont(d) {
    cfg.font = clamp(cfg.font + d, 24, 160);
    el.fontVal.textContent = cfg.font;
    if (el.prompter.classList.contains("active")) {
      var ratio = maxOffset() ? offset / maxOffset() : 0;
      applyPrompterStyle();
      offset = ratio * maxOffset();  // 換字級後盡量維持相對位置
      render();
    }
    save();
  }
  function changeMargin(d) {
    cfg.margin = clamp(cfg.margin + d, 0, 25);
    el.marginVal.textContent = cfg.margin;
    save();
  }

  var badgeTimer = null;
  function flashBadge() {
    el.speedBadge.classList.remove("hidden");
    clearTimeout(badgeTimer);
    if (playing) badgeTimer = setTimeout(function () { el.speedBadge.classList.add("hidden"); }, 1500);
  }

  // ---------- 控制列自動隱藏 ----------
  function showControls() {
    el.controls.classList.remove("hidden");
    el.exitBtn.classList.remove("hidden");
    el.speedBadge.classList.remove("hidden");
    clearTimeout(hideTimer);
  }
  function scheduleHideControls() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      if (playing) {
        el.controls.classList.add("hidden");
        el.exitBtn.classList.add("hidden");
        el.speedBadge.classList.add("hidden");
      }
    }, 2500);
  }

  // ---------- 防止螢幕休眠 ----------
  async function requestWakeLock() {
    try {
      if ("wakeLock" in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", function () { wakeLock = null; });
      }
    } catch (e) { /* 不支援就算了 */ }
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(function(){}); wakeLock = null; }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && el.prompter.classList.contains("active")) {
      requestWakeLock();
    }
  });

  // ---------- 畫面切換 ----------
  function enterPrompter() {
    cfg.text = el.script.value;
    save();
    el.text.textContent = cfg.text || "（腳本是空的，回去貼上文字吧）";
    applyPrompterStyle();
    el.prompter.classList.add("active");
    el.editor.style.display = "none";
    offset = 0; render();
    setPlaying(false);
    el.tapHint.style.display = "block";
    showControls();
    requestWakeLock();
  }
  function exitPrompter() {
    setPlaying(false);
    releaseWakeLock();
    el.prompter.classList.remove("active");
    el.editor.style.display = "flex";
    applyEditorUI();
  }

  // ---------- 事件綁定 ----------
  // 編輯畫面 steppers
  document.querySelectorAll("[data-act]").forEach(function (b) {
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      switch (b.dataset.act) {
        case "font+": changeFont(4); break;
        case "font-": changeFont(-4); break;
        case "speed+": changeSpeed(1); break;
        case "speed-": changeSpeed(-1); break;
        case "margin+": changeMargin(1); break;
        case "margin-": changeMargin(-1); break;
      }
      if (b.dataset.act.indexOf("margin") === 0 && el.prompter.classList.contains("active")) applyPrompterStyle();
    });
  });

  el.mirrorToggle.addEventListener("click", function () {
    cfg.mirror = !cfg.mirror;
    applyEditorUI();
    save();
  });

  el.script.addEventListener("input", function () { cfg.text = el.script.value; save(); });

  el.startBtn.addEventListener("click", enterPrompter);
  el.playBtn.addEventListener("click", function (e) { e.stopPropagation(); togglePlay(); });
  el.editBtn.addEventListener("click", function (e) { e.stopPropagation(); exitPrompter(); });
  el.exitBtn.addEventListener("click", function (e) { e.stopPropagation(); exitPrompter(); });
  el.restartBtn.addEventListener("click", function (e) { e.stopPropagation(); restart(); });

  // 點提詞區任一處 = 播放/暫停；同時喚出控制列
  el.scrollArea.addEventListener("click", function () {
    togglePlay();
    showControls();
    if (playing) scheduleHideControls();
  });

  // ---------- 藍牙遙控器 / 鍵盤 ----------
  // 多數翻頁筆會送方向鍵 / PageUp/Down / 空白 / Enter（音量鍵網頁抓不到）
  document.addEventListener("keydown", function (e) {
    if (!el.prompter.classList.contains("active")) return;
    var k = e.key;
    switch (k) {
      case " ":
      case "Enter":
      case "ArrowRight":
      case "PageDown":
        togglePlay(); showControls(); if (playing) scheduleHideControls();
        e.preventDefault(); break;
      case "ArrowLeft":
      case "PageUp":
        // 後退重讀：暫停並往回捲一段
        setPlaying(false); nudge(-el.scrollArea.clientHeight * 0.25); showControls();
        e.preventDefault(); break;
      case "ArrowUp":
        changeSpeed(1); e.preventDefault(); break;
      case "ArrowDown":
        changeSpeed(-1); e.preventDefault(); break;
      case "Escape":
        exitPrompter(); e.preventDefault(); break;
    }
  });

  // ---------- 啟動 ----------
  applyEditorUI();
})();
</script>
</body>
</html>
